<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit a complaint · Hostel Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main">
    <div class="main-header">
      <div>
        <h1>Submit a complaint</h1>
        <p>Describe the issue in your own words — category and priority are detected for you.</p>
      </div>
    </div>

    <div class="panel form-card">
      <div class="panel-body">
        <div id="formBanner"></div>
        <form id="complaintForm" novalidate>
          <div class="field">
            <label for="title">Title</label>
            <input type="text" id="title" placeholder="Short summary, e.g. Leaking tap in room bathroom" required>
          </div>
          <div class="field">
            <label for="description">Description</label>
            <textarea id="description" placeholder="What's happening, since when, and anything the maintenance team should know." required></textarea>
          </div>
          <div class="field">
            <label for="photo">Photo (optional)</label>
            <input type="file" id="photo" accept="image/*">
            <img id="photoPreview" class="photo-preview" alt="Selected photo preview">
            <div id="visionStatus" class="vision-status"></div>
          </div>
          <button type="submit" class="btn btn-primary">Submit complaint</button>
        </form>
        <div class="ai-note">
          <span aria-hidden="true">🤖</span>
          <div>Hostel Care reads your description (and photo, if you add one) to sort the issue into a category — Plumber, Electrician, Carpenter, Mess, or General — and flag how urgent it is.</div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="js/store.js"></script>
<script src="js/auth.js"></script>
<script src="js/layout.js"></script>
<script src="js/classifier.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js"></script>
<script>
  Store.seedIfEmpty();
  const user = Layout.mount("submit");

  let photoDataUrl = "";
  let photoLabel = "";
  let photoConfidence = 0;
  let visionModelPromise = null;

  function getVisionModel() {
    if (!visionModelPromise) visionModelPromise = mobilenet.load();
    return visionModelPromise;
  }

  function resizeImageFile(file, maxDim, quality) {
    return new Promise(function (resolve, reject) {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function (e) {
        const img = new Image();
        img.onerror = reject;
        img.onload = function () {
          let width = img.width;
          let height = img.height;
          if (width > height && width > maxDim) {
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve({ dataUrl: canvas.toDataURL("image/jpeg", quality), canvas: canvas });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  if (user && user.role === "admin") {
    window.location.href = "dashboard.html";
  } else if (user) {
    document.getElementById("photo").addEventListener("change", async function (e) {
      const file = e.target.files[0];
      const status = document.getElementById("visionStatus");
      const preview = document.getElementById("photoPreview");
      if (!file) return;

      status.textContent = "Analyzing photo…";
      try {
        const resized = await resizeImageFile(file, 480, 0.7);
        photoDataUrl = resized.dataUrl;
        preview.src = photoDataUrl;
        preview.style.display = "block";

        const model = await getVisionModel();
        const predictions = await model.classify(resized.canvas, 5);
        if (predictions && predictions.length) {
          // MobileNet's top guess is sometimes an unrelated ImageNet class
          // (e.g. a tap photographed at an odd angle might come back as
          // "table"). Check all top-5 guesses and use the first one that
          // maps to a category we recognise, instead of blindly trusting
          // rank #1.
          const labels = predictions.map((p) => p.className.split(",")[0]);
          const picked = Classifier.hintFromLabels(labels);
          photoLabel = picked.label;
          photoConfidence = Math.round(predictions[picked.index].probability * 100);
          status.textContent = picked.hint
            ? "🤖 Photo suggests: " + photoLabel + " (" + photoConfidence + "% match) — looks like a " + picked.hint + " issue"
            : "🤖 Photo detected: " + photoLabel + " (" + photoConfidence + "% match) — couldn't confidently match a category from the photo alone, so your description will be used instead.";
        } else {
          status.textContent = "";
        }
      } catch (err) {
        status.textContent = "Couldn't analyze the photo (offline?) — it'll still be attached when you submit.";
      }
    });

    document.getElementById("complaintForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const title = document.getElementById("title").value.trim();
      const description = document.getElementById("description").value.trim();
      const banner = document.getElementById("formBanner");
      if (!title || !description) {
        banner.innerHTML = '<div class="form-banner error">Please add both a title and a description.</div>';
        return;
      }
      const result = Classifier.classify(title, description);
      const complaint = Store.addComplaint({
        userId: user.id,
        title: title,
        description: description,
        category: result.category,
        priority: result.priority,
        confidence: result.confidence,
        photo: photoDataUrl,
        photoLabel: photoLabel,
        photoConfidence: photoConfidence,
      });
      window.location.href = "complaint.html?id=" + complaint.id + "&submitted=1";
    });
  }
</script>
</body>
</html>
