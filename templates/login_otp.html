{% extends "base.html" %}
{% block title %}Login with OTP{% endblock %}
{% block content %}
<div class="login-container">
    <div class="card">
        <div class="card-body p-5">
            <h2 class="card-title text-center mb-4">📧 Login with OTP</h2>
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            <form method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Registered Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mb-3">Send OTP</button>
            </form>
            <p class="text-center mb-0"><a href="{{ url_for('login') }}" class="text-decoration-none">← Back to normal login</a></p>
        </div>
    </div>
</div>
{% endblock %}
