{% extends "base.html" %}

{% block title %}Register - Hostel Complaint Management{% endblock %}

{% block content %}
<div class="login-container">
    <div class="card">
        <div class="card-body p-5">
            <h2 class="card-title text-center mb-4">📝 Register</h2>
            
            {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
            {% endif %}
            
            <form method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" required>
                </div>
                
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" required>
                </div>
                
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                
                <div class="mb-3">
                    <label for="room_number" class="form-label">Room Number</label>
                    <input type="text" class="form-control" id="room_number" name="room_number" placeholder="e.g., A101">
                </div>
                
                <button type="submit" class="btn btn-primary w-100 mb-3">Register</button>
            </form>
            
            <hr>
            
            <p class="text-center mb-0">
                Already have an account? <a href="{{ url_for('login') }}" class="text-decoration-none">Login here</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
